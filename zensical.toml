# ----------------------------------------------------------------------------
[project]

# The site_name is shown in the page header and the browser window title
site_name = "Practicalli Clojure Web Services"

# The site_description is included in the HTML head and should contain a
# meaningful description of the site content for use by search engines.
site_description = "Practical guide to building web applications and apis with the Clojure programming language. Using a Clojure REPL driven development workflow for code development and a Clojure reloaded workflow to manage components of a back-end service"

# The site_author attribute is used in the HTML head element.
site_author = "Practicalli Johnny"

# The site_url is the canonical URL for your site
site_url = "https://practical.li/clojure-web-services"

# The copyright notice appears in the page footer and can contain an HTML fragment.
copyright = """
Copyright &copy; 2026 Practicalli
"""

